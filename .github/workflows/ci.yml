name: CI

on:
  push:
    branches: [main, refactor/modular-restructure]
  pull_request:
    branches: [main, refactor/modular-restructure]
jobs:
  test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript Build Check
        run: pnpm build
      - name: Run Unit & Integration Tests
        run: pnpm test
      - name: Run Master Feature Audit
        run: node node_modules/typescript/bin/tsc -p tsconfig.test.json && node dist-test/scripts/verify-all-features.js