
server:
  port: 9708
  workers: 2
  upstreams:
    - id: u1
      url: http://127.0.0.1:19708
  paths:
    - path: /
      upstream: [u1]
  loadBalancing:
    strategy: round-robin
    retry:
      maxAttempts: 1
      statusCodes: [502, 503]
  resilience:
    circuitBreaker:
      mode: classic
      failureThreshold: 100
      recoveryTimeMs: 1000
  connectTimeoutMs: 5000
  readTimeoutMs: 12000
