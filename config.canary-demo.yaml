server:
  host: "0.0.0.0"
  port: 8080
  workers: 2
  trustProxy: true
  upstreams:
    - id: "kotlin-baseline"
      url: "http://127.0.0.1:8082"
      weight: 1
      healthPath: "/api"
    - id: "kotlin-canary"
      url: "http://127.0.0.1:8085"
      weight: 1
      healthPath: "/api"
  paths:
    - path: "/api"
      upstream: ["kotlin-baseline"]
      canary:
        enabled: true
        canaryUpstream: "kotlin-canary"
        baselineUpstream: "kotlin-baseline"
        weight: 30
        stickyCookieName: "NINJA_CANARY"
        headerKey: "x-canary"
        headerValue: "beta"
        stage: "canary-v2"

loadBalancing:
  strategy: "round-robin"

observability:
  logging:
    level: "info"
