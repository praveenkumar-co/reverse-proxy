server:
  listen: 8080
  httpsPort: 8443
  workers: 4
  compression: true
  connectTimeoutMs: 5000
  readTimeoutMs: 30000
  accessLog: access.log
  eventLog: events.log

  loadBalancing:
    strategy: weighted-round-robin
    failureThreshold: 3
    recoveryTimeMs: 30000
    virtualNodes: 150
    ewmaAlpha: 0.1
    stickyCookieName: NINJA_ROUTE
    slowStartSeconds: 30
    retry:
      maxAttempts: 3
      statusCodes: [500, 502, 503, 504]

  resilience:
    circuitBreaker:
      mode: classic
    retry:
      baseDelayMs: 100
      maxDelayMs: 5000
      budgetPercent: 15

  upstreams:
    - id: backend-1
      url: http://localhost:3001
      weight: 3
      healthPath: /health
    - id: backend-2
      url: http://localhost:3002
      weight: 1
      healthPath: /health

  paths:
    - path: /api
      upstream: [backend-1, backend-2]
      rateLimit:
        maxRequests: 100
        windowMs: 60000
        algorithm: sliding-window-log
        storage: memory
      cache:
        enabled: true
        ttlSeconds: 60

  cache:
    enabled: true
    host: localhost
    port: 6379
    ttlSeconds: 300
    l1Enabled: true
    l1MaxSize: 500
    debezium:
      enabled: false
      channel: dbz-events
      mappings: []
