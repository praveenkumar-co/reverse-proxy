# Ninja Reverse Proxy — Documented Example Configuration
# Copy this file to config.yaml to run the proxy.

server:
  host: "0.0.0.0"
  port: 8080
  workers: 0                    # 0 = auto (CPU count)
  trustProxy: true
  connectTimeoutMs: 5000
  readTimeoutMs: 15000
  compression: false

tls:
  enabled: false
  cert: "./certs/cert.pem"
  key: "./certs/key.pem"
  redirectHttp: true            # 301 HTTP → HTTPS when TLS enabled
  httpsPort: 8443

upstreams:
  - id: app-a
    url: "http://127.0.0.1:3001"
    weight: 3
    maxConnections: 200
  - id: app-b
    url: "http://127.0.0.1:3002"
    weight: 1
    maxConnections: 200

routes:
  - path: "/api"
    upstreams: ["app-a", "app-b"]
    rateLimit:
      windowMs: 60000
      maxRequests: 100
      algorithm: token-bucket
      storage: memory
    cache:
      enabled: true
      ttlSeconds: 60
    sticky: true

loadBalancing:
  strategy: power-of-two          # round-robin | weighted-round-robin | least-connections | weighted-least-connections | least-response-time | power-of-two | consistent-hashing | ip-hash | sticky-sessions | resource-based | random | adaptive-wrr
  virtualNodes: 150               # consistent-hashing only (recommended 100–200)
  ewmaAlpha: 0.1                  # least-response-time EWMA smoothing
  stickyCookieName: "NINJA_ROUTE"
  stickyMaxAgeSeconds: 3600
  slowStartSeconds: 30

resilience:
  retry:
    enabled: true
    maxAttempts: 3
    backoff: full-jitter          # full-jitter | equal-jitter | decorrelated-jitter | exponential
    baseDelayMs: 100
    maxDelayMs: 5000
    budgetPercent: 15             # max % of requests that may be retries
    retryOn:
      localNodeFailure: true
      systemOverload: true
  circuitBreaker:
    mode: adaptive                # classic | adaptive
    failureThreshold: 3
    recoveryTimeMs: 15000
    K: 2
    windowMs: 10000
  bulkhead:
    enabled: false
    maxConcurrentPerUpstream: 100

rateLimit:
  enabled: true
  storage: memory                 # memory | redis | hybrid
  algorithm: token-bucket         # fixed-window | sliding-window-log | sliding-window-counter | token-bucket | leaking-bucket
  windowMs: 60000
  maxRequests: 200
  softLimit: false
  redis:
    host: "127.0.0.1"
    port: 6379
    keyPrefix: "rl:"
  headers: true                   # emit X-RateLimit-* and Retry-After

cache:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  ttlSeconds: 60
  l1Enabled: true
  l1MaxSize: 10000
  staleWhileRevalidate: true
  staleIfError: true
  key:
    ignoreQueryParams: ["utm_source", "utm_medium"]
    varyHeaders: ["Accept", "Accept-Encoding"]
  debezium:
    enabled: false
    channel: "debezium.cache"
    mappings:
      - table: "public.users"
        pathPattern: "/api/users*"

discovery:
  mode: static                    # static | dynamic
  heartbeatTtlMs: 30000
  health:
    active:
      enabled: true
      intervalMs: 10000
      timeoutMs: 2000
      path: "/health"
      healthyThreshold: 2
      unhealthyThreshold: 3
    passive:
      enabled: true

observability:
  logging:
    level: info                   # debug | info | warn | error
    accessLog: true
  metrics:
    enabled: true
    path: "/metrics"
    histograms: true
  tracing:
    enabled: false
    endpoint: ""

admin:
  enabled: true
  pathPrefix: "/__admin"
