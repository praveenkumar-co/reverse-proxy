server:
  listen: 8080
  httpsPort: 8443
  workers: 6

  loadBalancing:
    strategy: round-robin
    failureThreshold: 3
    recoveryTimeMs: 15000

  autoScaling:
    enabled: false
    minServers: 1
    maxServers: 1
    scaleUpAt: 3
    scaleDownAt: 1
    cooldownMs: 60000
    startPort: 9000
    proxyPort: 8080

  cache:
    enabled: true
    host: redis
    port: 6379
    ttlSeconds: 60

  upstreams:
  - id: transcoder-api
    url: http://host.docker.internal:4000

  paths:
    - path: /
      upstream:
        - transcoder-api
      rateLimit:
        windowMs: 60000
        maxRequests: 1000000

  headers:
    - key: X-Forwarded-For
      value: $proxy_add_x_forwarded_for

    - key: X-Real-IP
      value: $remote_addr