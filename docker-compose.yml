services:

  redis:
    image: redis:7-alpine
    networks:
      - proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
      - "18443:8443"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    driver: bridge