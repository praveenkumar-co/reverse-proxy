apiVersion: v1
kind: ConfigMap
metadata:
  name: ninja-proxy-config
  namespace: reverse-proxy
  labels:
    app: ninja-reverse-proxy
data:
  config.yaml: |
    server:
      listen: 8080
      httpsPort: 8443
      workers: 2

      loadBalancing:
        strategy: round-robin
        failureThreshold: 3
        recoveryTimeMs: 15000

      cache:
        enabled: false
        host: redis
        port: 6379
        ttlSeconds: 60

      upstreams:
        - id: backend-a
          url: http://backend-a-svc:3001

        - id: backend-b
          url: http://backend-b-svc:3002

      paths:
        - path: /
          upstream:
            - backend-a
            - backend-b
          rateLimit:
            windowMs: 60000
            maxRequests: 10000

      headers:
        - key: X-Forwarded-For
          value: client_ip
        - key: X-Real-IP
          value: client_ip
