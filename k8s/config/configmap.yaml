apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy-config
  namespace: reverse-proxy

data:
  config.yaml: |
    server:
      listen: 8080
      httpsPort: 8443
      workers: 6

      loadBalancing:
        strategy: round-robin
        failureThreshold: 3
        recoveryTimeMs: 15000

      autoScaling:
        enabled: true
        minServers: 2
        maxServers: 10
        scaleUpAt: 1
        scaleDownAt: 0
        cooldownMs: 60000
        startPort: 9000
        proxyPort: 8080

      cache:
        enabled: false
        host: redis
        port: 6379
        ttlSeconds: 60

      upstreams:
        - id: node1
          url: http://node1:8001

        - id: node2
          url: http://node2:8002

        - id: node3
          url: http://node3:8003

        - id: node4
          url: http://node4:8004