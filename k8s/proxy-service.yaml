# ============================================================
#  Service — Ninja Reverse Proxy
#
#  Exposes the proxy inside (and optionally outside) the cluster.
#
#  Apply with: kubectl apply -f k8s/proxy-service.yaml
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: ninja-reverse-proxy-svc
  namespace: default
  labels:
    app: ninja-reverse-proxy
spec:
  selector:
    app: ninja-reverse-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
      # nodePort: 30080  # Uncomment to expose on a fixed node port
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
      # nodePort: 30443  # Uncomment to expose on a fixed node port

  # ── Exposure options ────────────────────────────────────────
  #
  #  ClusterIP   → only accessible inside the cluster (default)
  #  NodePort    → accessible on each Node's IP at a static port
  #  LoadBalancer→ provisions a cloud load balancer (AWS ELB, GCP LB, etc.)
  #
  type: ClusterIP
  # type: NodePort
  # type: LoadBalancer
