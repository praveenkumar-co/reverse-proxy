apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninja-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ninja-proxy
  template:
    metadata:
      labels:
        app: ninja-proxy
    spec:
      containers:
        - name: ninja-proxy
          image: ninja-proxy
          imagePullPolicy: Never
          ports:
            - containerPort: 8443

---
apiVersion: v1
kind: Service
metadata:
  name: ninja-proxy
spec:
  type: NodePort
  selector:
    app: ninja-proxy
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443